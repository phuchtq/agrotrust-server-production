name: Build & Deploy to Azure

on:
  push:
    branches:
      - main # trigger on every push to main
    paths: # only run when relevant files change → saves minutes
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # allow manual runs from the GitHub UI

env:
  IMAGE_NAME: agrotrust # ACR repository name (lowercase)

# Cancel in-progress runs when a new push arrives → avoids wasting minutes
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Build and push Docker image to ACR
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    timeout-minutes: 15 # kill if build hangs — prevents runaway billing
    outputs:
      image-tag: ${{ steps.meta.outputs.sha-tag }}

    steps:
      # ── Checkout source ───────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v6

      # ── Login to Azure ────────────────────────────────────────
      - name: Login to Azure
        uses: Azure/login@v3.0.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Login to ACR ──────────────────────────────────────────
      - name: Login to Azure Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # ── Set image tags (latest + short git SHA) ───────────────
      - name: Generate image tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha-tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Image will be tagged: latest and ${SHORT_SHA}"

      # ── Set up Docker Buildx for layer caching ────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      # ── Build and push ────────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha-tag }}
          # Layer cache from the ACR registry — speeds up rebuilds when go.sum hasn't changed
          cache-from: type=registry,ref=${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ─────────────────────────────────────────────────────────────
  # Job 2: Deploy to Azure App Service
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to App Service
    runs-on: ubuntu-latest
    timeout-minutes: 10 # deployment should never exceed 10 min
    needs: build-and-push # deploy only starts AFTER build-and-push succeeds
    environment: production # enables manual approval gate in GitHub Environments

    steps:
      - name: Login to Azure
        uses: Azure/login@v3.0.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Deploy the SHA-tagged image so each deployment is traceable
      - name: Deploy to Azure App Service
        uses: Azure/webapps-deploy@v2.2.19
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}

      - name: Print deployment summary
        run: |
          echo "✅ Deployed image: ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}"
          echo "🔗 Commit: ${{ github.sha }}"
          echo "👤 Triggered by: ${{ github.actor }}"
